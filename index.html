<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Soyeon Lee | Neuroscience</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <main class="chamber">

    <div class="top-text">
      <p class="eyebrow">SOYEON LEE · NEUROSCIENCE</p>

      <h1>
        Same environment.<br>
        Different choices. Why?
      </h1>

      <p class="subtitle">
        Explore my research through the chamber.
      </p>
    </div>

    <div class="poke-wall">

      <button class="poke" data-section="play" aria-label="Play">
        <span></span>
      </button>

      <button class="poke" data-section="question" aria-label="Research question">
        <span></span>
      </button>

      <button class="poke" data-section="research" aria-label="Research">
        <span></span>
      </button>

      <button class="poke" data-section="next" aria-label="Next questions">
        <span></span>
      </button>

      <button class="poke" data-section="connect" aria-label="Connect">
        <span></span>
      </button>

    </div>

    <div class="labels">
      <span>PLAY</span>
      <span>QUESTION</span>
      <span>RESEARCH</span>
      <span>NEXT</span>
      <span>CONNECT</span>
    </div>

    <button class="reward-port" id="rewardPort">
      COMMUNITY
    </button>

    <p class="hint">
      Choose a nose poke
    </p>

  </main>

  <section class="info-panel" id="infoPanel">

    <button class="close-button" id="closeButton">
      ×
    </button>

    <div id="panelContent"></div>

  </section>

  <div class="overlay" id="overlay"></div>

  <script src="script.js"></script>

</body>
</html>
