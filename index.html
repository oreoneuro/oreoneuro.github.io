<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Soyeon Lee | Neuroscience</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <main class="chamber">

    <div class="top-text">
      <p class="eyebrow">SOYEON LEE · NEUROSCIENCE</p>
      <h1>Same environment.<br>Different choices.</h1>
      <p class="subtitle">
        Explore my research by choosing a poke.
      </p>
    </div>

    <div class="poke-wall">

      <button class="poke" data-section="about" aria-label="About me">
        <span>1</span>
      </button>

      <button class="poke" data-section="question" aria-label="Research question">
        <span>2</span>
      </button>

      <button class="poke" data-section="projects" aria-label="Projects">
        <span>3</span>
      </button>

      <button class="poke" data-section="cv" aria-label="CV">
        <span>4</span>
      </button>

      <button class="poke" data-section="github" aria-label="GitHub">
        <span>5</span>
      </button>

    </div>

    <div class="labels">
      <span>ABOUT</span>
      <span>QUESTION</span>
      <span>PROJECTS</span>
      <span>CV</span>
      <span>GITHUB</span>
    </div>

    <button class="reward-port" id="rewardPort">
      REWARD
    </button>

    <p class="hint">
      Choose a nose poke
    </p>

  </main>

  <section class="info-panel" id="infoPanel">

    <button class="close-button" id="closeButton">
      ×
    </button>

    <div id="panelContent"></div>

  </section>

  <div class="overlay" id="overlay"></div>

  <script src="script.js"></script>

</body>
</html>
